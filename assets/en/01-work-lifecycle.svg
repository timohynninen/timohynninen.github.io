<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" role="img" aria-labelledby="title desc"><title id="title">Work lifecycle</title><desc id="desc">A diagram of the work lifecycle from need and scope to closure and evaluation.</desc><style>text{font-family:Arial,sans-serif;fill:#17232b}.b{fill:#e5f3f8;stroke:#005b82;stroke-width:3}.a{stroke:#005b82;stroke-width:4;fill:none;marker-end:url(#m)}.s{font-size:21px;font-weight:bold}.p{font-size:16px}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#005b82"/></marker></defs><rect class="b" x="25" y="100" width="135" height="80" rx="12"/><rect class="b" x="190" y="100" width="135" height="80" rx="12"/><rect class="b" x="355" y="100" width="135" height="80" rx="12"/><rect class="b" x="520" y="100" width="135" height="80" rx="12"/><rect class="b" x="685" y="100" width="135" height="80" rx="12"/><rect class="b" x="850" y="100" width="125" height="80" rx="12"/><path class="a" d="M160 140H185M325 140H350M490 140H515M655 140H680M820 140H845"/><text x="48" y="132" class="s">Need &amp; scope</text><text x="220" y="132" class="s">Plan</text><text x="374" y="132" class="s">Implement</text><text x="536" y="132" class="s">Monitor</text><text x="706" y="132" class="s">Handover</text><text x="866" y="132" class="s">Close</text><text x="45" y="220" class="p">A lifecycle helps make the next required action visible.</text></svg>
