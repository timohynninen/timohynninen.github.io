<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" role="img" aria-labelledby="title desc"><title id="title">Päätöksen rakenne</title><desc id="desc">Toimivalta, selvitetyt tosiseikat, oikeusohje, harkinta, ratkaisu ja perustelut muodostavat päätöksen ketjun.</desc><style>text{font-family:Arial,sans-serif;fill:#17232b}.b{fill:#e5f3f8;stroke:#005b82;stroke-width:3}.a{stroke:#005b82;stroke-width:4;fill:none;marker-end:url(#m)}.s{font-size:23px;font-weight:bold}.p{font-size:17px}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#005b82"/></marker></defs><rect class="b" x="25" y="115" width="140" height="88" rx="12"/><rect class="b" x="190" y="115" width="140" height="88" rx="12"/><rect class="b" x="355" y="115" width="140" height="88" rx="12"/><rect class="b" x="520" y="115" width="140" height="88" rx="12"/><rect class="b" x="685" y="115" width="130" height="88" rx="12"/><rect class="b" x="840" y="115" width="135" height="88" rx="12"/><path class="a" d="M165 159H185M330 159H350M495 159H515M660 159H680M815 159H835"/><text x="43" y="150" class="s">Toimivalta</text><text x="40" y="178" class="p">kuka saa ratkaista?</text><text x="205" y="145" class="s">Tosiseikat</text><text x="205" y="172" class="p">mitä on selvitetty?</text><text x="377" y="150" class="s">Oikeusohje</text><text x="380" y="178" class="p">mikä säännös?</text><text x="545" y="150" class="s">Harkinta</text><text x="538" y="178" class="p">miten sovelletaan?</text><text x="702" y="150" class="s">Ratkaisu</text><text x="702" y="178" class="p">mitä päätetään?</text><text x="850" y="145" class="s">Perustelut</text><text x="850" y="172" class="p">miksi näin?</text><text x="265" y="285" class="p">Fiktiivinen tapaus harjoittaa rakennetta, ei muodosta viranomaispäätöstä.</text></svg>
