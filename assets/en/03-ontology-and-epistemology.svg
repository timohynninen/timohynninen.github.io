<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" role="img" aria-labelledby="title desc"><title id="title">Ontology and epistemology map</title><desc id="desc">A diagram from a bounded phenomenon to question, evidence and a bounded claim.</desc><style>text{font-family:Arial,sans-serif;fill:#17232b}.b{fill:#e5f3f8;stroke:#005b82;stroke-width:3}.g{fill:#fff7dc;stroke:#a05500;stroke-width:3}.a{stroke:#005b82;stroke-width:4;fill:none;marker-end:url(#m)}.s{font-size:24px;font-weight:bold}.p{font-size:17px}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#005b82"/></marker></defs><rect class="b" x="45" y="80" width="190" height="120" rx="14"/><rect class="b" x="285" y="80" width="190" height="120" rx="14"/><rect class="b" x="525" y="80" width="190" height="120" rx="14"/><rect class="g" x="765" y="80" width="190" height="120" rx="14"/><path class="a" d="M235 140H280M475 140H520M715 140H760"/><text x="78" y="120" class="s">Ontology</text><text x="65" y="150" class="p">What is bounded?</text><text x="305" y="120" class="s">Question</text><text x="302" y="150" class="p">What is asked?</text><text x="560" y="120" class="s">Evidence</text><text x="545" y="150" class="p">How is it made?</text><text x="793" y="120" class="s">Claim</text><text x="783" y="150" class="p">What can be said?</text><path class="a" d="M525 215C500 275 395 295 300 270"/><rect class="b" x="260" y="260" width="480" height="60" rx="14"/><text x="335" y="290" class="s">Epistemology: grounds, interpretation and limits</text></svg>
