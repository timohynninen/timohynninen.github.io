<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" role="img" aria-labelledby="title desc"><title id="title">Study process cycle</title><desc id="desc">A diagram showing planning, study, practice, assessment and adjustment as a recursive study process.</desc><style>text{font-family:Arial,sans-serif;fill:#17232b}.b{fill:#e5f3f8;stroke:#005b82;stroke-width:3}.g{fill:#fff7dc;stroke:#a05500;stroke-width:3}.a{stroke:#005b82;stroke-width:4;fill:none;marker-end:url(#m)}.s{font-size:23px;font-weight:bold}.p{font-size:16px}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#005b82"/></marker></defs><rect class="b" x="45" y="130" width="160" height="85" rx="14"/><rect class="b" x="235" y="35" width="160" height="85" rx="14"/><rect class="b" x="420" y="130" width="160" height="85" rx="14"/><rect class="b" x="605" y="35" width="160" height="85" rx="14"/><rect class="g" x="795" y="130" width="160" height="85" rx="14"/><path class="a" d="M205 145L245 112M395 112L420 140M580 140L615 112M765 112L795 145"/><path class="a" d="M870 220C740 325 270 335 120 225"/><text x="78" y="166" class="s">Plan</text><text x="70" y="192" class="p">aim · timetable</text><text x="278" y="72" class="s">Study</text><text x="255" y="98" class="p">concepts · sources</text><text x="438" y="166" class="s">Practise</text><text x="435" y="192" class="p">apply · test</text><text x="625" y="72" class="s">Assess</text><text x="618" y="98" class="p">feedback · evidence</text><text x="827" y="166" class="s">Adjust</text><text x="810" y="192" class="p">next action</text></svg>
