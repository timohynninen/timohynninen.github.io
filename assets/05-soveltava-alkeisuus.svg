<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" role="img" aria-labelledby="title desc"><title id="title">Aristoteelisen harkinnan kehä</title><desc id="desc">Kaavio näyttää päämäärän, keinojen vertailun, päätöksen, seurannan ja korjaavan uuden harkinnan.</desc><style>text{font-family:Arial,sans-serif;fill:#17232b}.b{fill:#e5f3f8;stroke:#005b82;stroke-width:3}.g{fill:#fff7dc;stroke:#a05500;stroke-width:3}.a{stroke:#005b82;stroke-width:4;fill:none;marker-end:url(#m)}.s{font-size:24px;font-weight:bold}.p{font-size:17px}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#005b82"/></marker></defs><rect class="g" x="55" y="120" width="180" height="85" rx="14"/><rect class="b" x="285" y="45" width="190" height="105" rx="14"/><rect class="b" x="525" y="45" width="190" height="105" rx="14"/><rect class="b" x="765" y="120" width="180" height="85" rx="14"/><rect class="b" x="400" y="250" width="200" height="60" rx="14"/><path class="a" d="M235 145L285 105M475 100H520M715 105L765 145M820 205C760 265 660 278 605 278M400 280C260 260 160 225 140 210"/><text x="80" y="155" class="s">Päämäärä</text><text x="85" y="183" class="p">mikä suunta?</text><text x="322" y="82" class="s">Keinot</text><text x="305" y="110" class="p">mitä voidaan tehdä?</text><text x="553" y="82" class="s">Harkinta</text><text x="545" y="110" class="p">seuraukset · rajat</text><text x="797" y="155" class="s">Päätös</text><text x="787" y="183" class="p">mitä tehdään nyt?</text><text x="428" y="287" class="s">Seurantaehto</text><text x="308" y="200" class="p">“we deliberate not about ends, but about the means”</text></svg>
