<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" role="img" aria-labelledby="title desc"><title id="title">Ontologian ja epistemologian kartta</title><desc id="desc">Kaavio näyttää, miten ilmiön rajaus johtaa tutkimuskysymykseen, aineistoon, tulkintaan ja rajattuun väitteeseen.</desc><style>text{font-family:Arial,sans-serif;fill:#17232b}.b{fill:#e5f3f8;stroke:#005b82;stroke-width:3}.g{fill:#fff7dc;stroke:#a05500;stroke-width:3}.a{stroke:#005b82;stroke-width:4;fill:none;marker-end:url(#m)}.s{font-size:24px;font-weight:bold}.p{font-size:17px}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#005b82"/></marker></defs><rect class="b" x="45" y="80" width="190" height="120" rx="14"/><rect class="b" x="285" y="80" width="190" height="120" rx="14"/><rect class="b" x="525" y="80" width="190" height="120" rx="14"/><rect class="g" x="765" y="80" width="190" height="120" rx="14"/><path class="a" d="M235 140H280M475 140H520M715 140H760"/><text x="78" y="120" class="s">Ontologia</text><text x="65" y="150" class="p">Mikä ilmiö on?</text><text x="65" y="175" class="p">Mikä rajataan?</text><text x="305" y="120" class="s">Kysymys</text><text x="302" y="150" class="p">Mitä halutaan</text><text x="302" y="175" class="p">selvittää?</text><text x="560" y="120" class="s">Aineisto</text><text x="545" y="150" class="p">Miten havainnot</text><text x="545" y="175" class="p">syntyvät?</text><text x="793" y="120" class="s">Väite</text><text x="783" y="150" class="p">Mitä voidaan</text><text x="783" y="175" class="p">perustellusti sanoa?</text><path class="a" d="M525 215C500 275 395 295 300 270"/><rect class="b" x="260" y="260" width="480" height="60" rx="14"/><text x="335" y="290" class="s">Epistemologia: perustelu, tulkinta ja raja</text></svg>
