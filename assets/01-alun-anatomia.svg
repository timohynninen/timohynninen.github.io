<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" role="img" aria-labelledby="t d"><title id="t">Alun anatomia</title><desc id="d">Prosessi taustasta merkkiin, päätökseen ja tekoon. Tulkinta voi palata taustaan.</desc><style>text{font-family:Arial,sans-serif;fill:#17232b}.b{fill:#e5f3f8;stroke:#005b82;stroke-width:3}.a{stroke:#005b82;stroke-width:4;fill:none;marker-end:url(#m)}.s{font-size:25px;font-weight:bold}.p{font-size:18px}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6Z" fill="#005b82"/></marker></defs><rect class="b" x="35" y="105" width="190" height="100" rx="12"/><rect class="b" x="285" y="105" width="190" height="100" rx="12"/><rect class="b" x="535" y="105" width="190" height="100" rx="12"/><rect class="b" x="785" y="105" width="180" height="100" rx="12"/><path class="a" d="M225 155H280M475 155H530M725 155H780"/><path class="a" d="M875 210 C875 285 130 285 130 210"/><text x="70" y="145" class="s">Tausta</text><text x="65" y="175" class="p">tapahtumat ja</text><text x="65" y="197" class="p">valmistelu</text><text x="320" y="145" class="s">Merkki</text><text x="315" y="175" class="p">jokin tulee</text><text x="315" y="197" class="p">havaittavaksi</text><text x="565" y="145" class="s">Päätös</text><text x="565" y="175" class="p">rajaus nimetään</text><text x="565" y="197" class="p">alkupisteeksi</text><text x="830" y="145" class="s">Teko</text><text x="815" y="175" class="p">toiminta tekee</text><text x="815" y="197" class="p">tulkinnan näkyväksi</text><text x="370" y="305" class="p">myöhempi tieto voi muuttaa käsitystä alusta</text></svg>
