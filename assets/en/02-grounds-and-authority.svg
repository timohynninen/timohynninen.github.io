<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" role="img" aria-labelledby="title desc"><title id="title">Traceable decision chain</title><desc id="desc">Authority, facts, legal rule, deliberation, decision and reasons form a traceable chain.</desc><style>text{font-family:Arial,sans-serif;fill:#17232b}.b{fill:#e5f3f8;stroke:#005b82;stroke-width:3}.a{stroke:#005b82;stroke-width:4;fill:none;marker-end:url(#m)}.s{font-size:20px;font-weight:bold}.p{font-size:15px}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#005b82"/></marker></defs><rect class="b" x="25" y="100" width="135" height="80" rx="12"/><rect class="b" x="190" y="100" width="135" height="80" rx="12"/><rect class="b" x="355" y="100" width="135" height="80" rx="12"/><rect class="b" x="520" y="100" width="135" height="80" rx="12"/><rect class="b" x="685" y="100" width="135" height="80" rx="12"/><rect class="b" x="850" y="100" width="125" height="80" rx="12"/><path class="a" d="M160 140H185M325 140H350M490 140H515M655 140H680M820 140H845"/><text x="52" y="132" class="s">Authority</text><text x="232" y="132" class="s">Facts</text><text x="375" y="132" class="s">Legal rule</text><text x="535" y="132" class="s">Deliberate</text><text x="711" y="132" class="s">Decision</text><text x="865" y="132" class="s">Reasons</text><text x="45" y="220" class="p">A decision is assessable when its chain can be followed.</text></svg>
