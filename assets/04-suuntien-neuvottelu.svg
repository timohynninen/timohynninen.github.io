<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" role="img" aria-labelledby="title desc"><title id="title">Opiskeluprosessin kehä</title><desc id="desc">Kaavio kuvaa opiskeluprosessin vaiheet suunnittelusta opiskeluun, harjoitteluun, arviointiin ja työn säätämiseen.</desc><style>text{font-family:Arial,sans-serif;fill:#17232b}.b{fill:#e5f3f8;stroke:#005b82;stroke-width:3}.g{fill:#fff7dc;stroke:#a05500;stroke-width:3}.a{stroke:#005b82;stroke-width:4;fill:none;marker-end:url(#m)}.s{font-size:23px;font-weight:bold}.p{font-size:16px}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#005b82"/></marker></defs><rect class="b" x="45" y="130" width="160" height="85" rx="14"/><rect class="b" x="235" y="35" width="160" height="85" rx="14"/><rect class="b" x="420" y="130" width="160" height="85" rx="14"/><rect class="b" x="605" y="35" width="160" height="85" rx="14"/><rect class="g" x="795" y="130" width="160" height="85" rx="14"/><path class="a" d="M205 145L245 112M395 112L420 140M580 140L615 112M765 112L795 145"/><path class="a" d="M870 220C740 325 270 335 120 225"/><text x="67" y="166" class="s">Suunnittele</text><text x="66" y="192" class="p">tavoite · aikataulu</text><text x="268" y="72" class="s">Opiskele</text><text x="255" y="98" class="p">käsitteet · lähteet</text><text x="438" y="166" class="s">Harjoittele</text><text x="435" y="192" class="p">sovella · kokeile</text><text x="625" y="72" class="s">Arvioi</text><text x="618" y="98" class="p">palaute · näyttö</text><text x="827" y="166" class="s">Säädä</text><text x="810" y="192" class="p">seuraava askel</text><text x="350" y="335" class="p">Opiskeluprosessi palaa havaintojen perusteella aiempaan vaiheeseen.</text></svg>
